[project]
name = "bildzitate"
version = "0.1.0"
description = "Django app for 'Datenbank literarischer Bildzitate"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "acdh-django-browsing>=3.2",
    "django>=5.2.7",
    "django-autocomplete-light>=3.12.1",
    "django-extensions>=4.1",
    "django-next-prev>=1.1.0",
    "django-spaghetti-and-meatballs>=0.4.2",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.11",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "ruff>=0.15.21",
]
